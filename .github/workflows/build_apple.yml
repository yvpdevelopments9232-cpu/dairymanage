name: Build iOS IPA & macOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_edition:
        description: 'Select edition to build (all, hybrid, offline, online)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hybrid
          - offline
          - online

jobs:
  # =========================================================
  # JOB 1: BUILD IOS IPA (HYBRID, OFFLINE, ONLINE)
  # =========================================================
  build-ios-ipa:
    name: Build iOS IPA (${{ matrix.edition }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        edition: [hybrid, offline, online]
    steps:
      - name: Check whether to build this edition
        id: filter
        run: |
          TARGET="${{ github.event.inputs.target_edition }}"
          EDITION="${{ matrix.edition }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "$EDITION" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode Version
        if: steps.filter.outputs.should_run == 'true'
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Flutter SDK
        if: steps.filter.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        if: steps.filter.outputs.should_run == 'true'
        run: flutter precache --ios

      - name: Install Flutter Dependencies
        if: steps.filter.outputs.should_run == 'true'
        run: flutter pub get

      - name: Compile iOS Release (${{ matrix.edition }})
        if: steps.filter.outputs.should_run == 'true'
        run: |
          if [ "${{ matrix.edition }}" = "hybrid" ]; then
            ENTRY_POINT="lib/main_hybrid.dart"
          elif [ "${{ matrix.edition }}" = "offline" ]; then
            ENTRY_POINT="lib/main_offline.dart"
          else
            ENTRY_POINT="lib/main.dart"
          fi
          flutter build ios --release --no-codesign -t "$ENTRY_POINT"

      - name: Package Runner.app into installable .ipa
        if: steps.filter.outputs.should_run == 'true'
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r -y "DairyManagement_${{ matrix.edition }}.ipa" Payload
          mkdir -p ../../../output_ios
          mv "DairyManagement_${{ matrix.edition }}.ipa" ../../../output_ios/
          cd ../../../
          ls -lh output_ios/

      - name: Upload iOS ${{ matrix.edition }} IPA Artifact
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DairyManagement_iOS_${{ matrix.edition }}_IPA
          path: output_ios/DairyManagement_${{ matrix.edition }}.ipa
          retention-days: 14

  # =========================================================
  # JOB 2: BUILD MACOS APP (HYBRID, OFFLINE, ONLINE)
  # =========================================================
  build-macos:
    name: Build macOS (${{ matrix.edition }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        edition: [hybrid, offline, online]
    steps:
      - name: Check whether to build this edition
        id: filter
        run: |
          TARGET="${{ github.event.inputs.target_edition }}"
          EDITION="${{ matrix.edition }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "$EDITION" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode Version
        if: steps.filter.outputs.should_run == 'true'
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Flutter SDK
        if: steps.filter.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache macOS Artifacts
        if: steps.filter.outputs.should_run == 'true'
        run: flutter precache --macos

      - name: Install Flutter Dependencies
        if: steps.filter.outputs.should_run == 'true'
        run: flutter pub get

      - name: Compile macOS Release (${{ matrix.edition }})
        if: steps.filter.outputs.should_run == 'true'
        run: |
          if [ "${{ matrix.edition }}" = "hybrid" ]; then
            ENTRY_POINT="lib/main_hybrid.dart"
          elif [ "${{ matrix.edition }}" = "offline" ]; then
            ENTRY_POINT="lib/main_offline.dart"
          else
            ENTRY_POINT="lib/main.dart"
          fi
          flutter build macos --release -t "$ENTRY_POINT"

      - name: Package macOS App into ZIP
        if: steps.filter.outputs.should_run == 'true'
        run: |
          mkdir -p output_macos
          cd build/macos/Build/Products/Release
          zip -r -y "../../../../../output_macos/DairyManagement_${{ matrix.edition }}_macOS.zip" *.app
          cd ../../../../../
          ls -lh output_macos/

      - name: Upload macOS ${{ matrix.edition }} Artifact
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DairyManagement_macOS_${{ matrix.edition }}
          path: output_macos/DairyManagement_${{ matrix.edition }}_macOS.zip
          retention-days: 14
