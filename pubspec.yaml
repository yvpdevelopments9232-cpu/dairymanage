name: dairy_management
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  image_picker: ^1.2.3
  pdf: ^3.13.0
  printing: ^5.15.0
  connectivity_plus: 6.1.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.jpg"
  image_path: "assets/icon.jpg"
